networks:
  ? moirai_network
services:
  postgresql:
    restart: always
    container_name: postgresql
    hostname: postgresql
    image: postgres:18-alpine
    networks:
      - moirai_network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: moirai
      POSTGRES_PASSWORD: moirai
      POSTGRES_DB: moirai
    volumes:
      - postgresql_data:/var/lib/postgresql
  qdrant:
    restart: always
    container_name: qdrant
    hostname: qdrant
    image: qdrant/qdrant:v1.17.1
    networks:
      - moirai_network
    ports:
      - "6333:6333"
      - "6334:6334"
  minio:
    restart: always
    container_name: minio
    hostname: minio
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    command: server /data --console-address ":9001"
    networks:
      - moirai_network
    environment:
      MINIO_ROOT_USER: moirairpg
      MINIO_ROOT_PASSWORD: moirairpg
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    container_name: minio-init
    hostname: minio-init
    image: cgr.dev/chainguard/minio-client@sha256:f99f0052305eefdc41a40cb7ac555734566e47e06871360eb28997e5c24d8e16
    depends_on:
      - minio
    networks:
      - moirai_network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set minio http://minio:9000 moirairpg moirairpg;
      mc mb --ignore-existing minio/moirai;
      mc anonymous set public minio/moirai;
      exit 0;
      "
  discord-mock:
    restart: always
    container_name: discord-mock
    hostname: discord-mock
    image: wiremock/wiremock:3.13.2
    networks:
      - moirai_network
    ports:
      - "8081:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock

volumes:
  minio_data:
  postgresql_data: